name: Deploy BookStore to Server

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 💡 ЭТАП 1: Сборка фронтенда в облаке GitHub (ИСПРАВЛЕНО)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # 💡 ШАГ А: Настраиваем PHP в облаке GitHub
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv

      # 💡 ШАГ Б: Скачиваем зависимости Composer, чтобы сгенерировать папку vendor и файлы Ziggy
      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Теперь npm run build пролетит без ошибок, так как vendor/tightenco/ziggy на месте!
      - name: Install dependencies and build Vue
        run: |
          npm install
          npm run build

      - name: Upload production assets
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: public/build/


  # 💡 ЭТАП 2: Легкий деплой на ваш VPS (Запускается только после успешного Этапа 1)
  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Скачиваем готовый скомпилированный фронтенд обратно в проект перед отправкой команды на сервер
      - name: Download compiled assets
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: public/build/

      # Подключаемся к вашему VPS по SSH и обновляем контейнеры
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/pet-project-books
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
