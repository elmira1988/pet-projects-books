name: Deploy BookStore to Server

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 💡 ЭТАП 1: Сборка фронтенда в облаке GitHub
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Настраиваем PHP в облаке GitHub для работы с зависимостями
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv

      # Скачиваем зависимости Composer, чтобы сгенерировать файлы автозагрузки и Ziggy
      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Настраиваем Node.js для сборки Vue/Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Собираем готовый продакшн-фронтенд
      - name: Install dependencies and build Vue
        run: |
          npm install
          npm run build

      # Сохраняем скомпилированные файлы во временное хранилище GitHub
      - name: Upload production assets
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: public/build/

  # 💡 ЭТАП 2: Легкий деплой на  VPS
  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Скачиваем скомпилированный фронтенд обратно в воркфлоу перед отправкой
      - name: Download compiled assets
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: public/build/

      # ⚡ ПЕРЕНОС ФАЙЛОВ: Копируем готовый фронтенд из GitHub на  сервер по SCP
      - name: Copy assets to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "public/build/*"
          target: "/var/www/pet-project-books/" # Буква 's' на конце обязательна!

          # Подключаемся к VPS по SSH и обновляем контейнеры Docker
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m # 🌟 ДОБАВИТЬ СТРОКУ: Увеличиваем лимит времени соединения
          script: |
            cd /var/www/pet-project-books
            git pull origin main

            # Пересобираем контейнеры
            docker compose -f docker-compose.prod.yml up -d --build

            # Устанавливаем зависимости (этот шаг отработает штатно)
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev --optimize-autoloader --no-interaction

            # Очищаем и создаем свежий кэш Laravel
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            # Безопасно запускаем миграции базы данных
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

