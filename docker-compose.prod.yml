services:
  # 1. КОНТЕЙНЕР ПРИЛОЖЕНИЯ (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet-project-books-app-1
    restart: always
    volumes:
      - ./:/var/www/html
      - .env:/var/www/html/.env
    depends_on:
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Файл лога не больше 10 МБ
        max-file: "3"     # Хранить не более 3 старых файлов

  # 2. КОНТЕЙНЕР ВЕБ-СЕРВЕРА (NGINX)
  web:
    image: nginx:alpine
    container_name: pet-project-books-nginx-1
    restart: always
    ports:
      - "8082:80"        # Порт 8082 теперь привязан к Nginx, а не к PHP!
    volumes:
      - ./:/var/www/html
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. КОНТЕЙНЕР БАЗЫ ДАННЫХ (MYSQL)
  mysql:
    image: mysql:8.0
    container_name: pet-project-books-mysql-1
    restart: always
    environment:
      MYSQL_DATABASE: pet_project_books
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"       # Проброс порта, если вам нужен удаленный доступ к БД
    volumes:
      - mysql_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Именованный том для сохранения данных базы при перезапуске контейнеров
volumes:
  mysql_data:
